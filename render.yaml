services:
  - type: web
    name: file-converter-api
    env: python
    region: singapore   # gần Việt Nam nhất
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      apt-get update && apt-get install -y libreoffice ghostscript || true
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # nhập tay trên Render dashboard
    healthCheckPath: /
